<div class="tc" style="padding:16px;background:var(--surface);display:flex;flex-direction:column;gap:12px">
<div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center">
<button class="tc-btn tc-btn--primary">הנעדר אותר</button>
<button class="tc-btn">השהה</button>
<button class="tc-btn">הפסק מסע</button>
<button class="tc-btn tc-btn--icon" aria-label="בחירה" aria-pressed="true"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M5 3l14 7-6 2-2 6z"/></svg></button>
<button class="tc-btn tc-btn--icon" aria-label="מדידה"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 17 17 3l4 4L7 21zM7 13l2 2M10 10l2 2M13 7l2 2"/></svg></button>
</div>
<div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px;border-radius:var(--radius-md);background:var(--danger-surface)">
<button class="tc-btn tc-btn--danger tc-btn--sm">התקשר</button>
<button class="tc-btn tc-btn--danger-ghost tc-btn--sm">פתח</button>
</div>
</div>
