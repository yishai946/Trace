name: Feature
description: A new capability for Trace
labels: ["type: feature"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What should exist when this is done, and for whom (manager / searcher)?
    validations: {required: true}
  - type: input
    id: refs
    attributes:
      label: Decision log reference
      placeholder: "Q12, Q39 ..."
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [mobile-field, web-command, backend, database, gis-python, auth, offline, maps, notifications, devops, design]
    validations: {required: true}
  - type: dropdown
    id: phase
    attributes:
      label: Phase
      options: [V0 MVP, V1 LPB, V2 Simulation, Future]
    validations: {required: true}
  - type: textarea
    id: done
    attributes:
      label: Done when
      value: "- [ ] Implemented and demoed\n- [ ] Tests added\n- [ ] Verified against the decision log"
    validations: {required: true}
