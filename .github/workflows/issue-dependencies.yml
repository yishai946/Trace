# Enforces the "Blocked by" relationships between issues:
# - an issue with open blockers cannot be assigned (the assignment is undone with a comment);
# - a Pull Request cannot close an issue that still has open blockers (the check fails);
# - the `blocked` label always matches whether an issue has open blockers;
# - every Pull Request (except a release from dev into main) names its issue with "Closes #N" or "Refs #N".
# With the PROJECT_TOKEN secret (a token with the `project` scope) it also moves board cards:
# unblocked → Ready, assigned → In progress. Without it the board is updated by hand.
name: Issue dependencies

on:
  issues:
    types: [assigned, closed, reopened]
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  issues: write
  pull-requests: read

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PROJECT_NUMBER: 6
        with:
          script: |
            const { owner, repo } = context.repo;
            const projects = process.env.PROJECT_TOKEN ? getOctokit(process.env.PROJECT_TOKEN) : null;

            async function openBlockers(issue_number) {
              const blockers = await github.paginate('GET /repos/{owner}/{repo}/issues/{issue_number}/dependencies/blocked_by', {
                owner, repo, issue_number,
              });
              return blockers.filter((b) => b.state === 'open');
            }

            async function syncBlockedLabel(issue, blockers) {
              const has = issue.labels.some((l) => (l.name ?? l) === 'blocked');
              if (blockers.length > 0 && !has) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: ['blocked'] });
              } else if (blockers.length === 0 && has) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: issue.number, name: 'blocked' });
                return true;
              }
              return false;
            }

            /** Sets the issue's Status on the project board, when PROJECT_TOKEN is configured. */
            async function setStatus(issue_number, status) {
              if (!projects) return;
              const { repository } = await projects.graphql(
                `query($owner: String!, $repo: String!, $n: Int!) {
                  repository(owner: $owner, name: $repo) { issue(number: $n) { projectItems(first: 20) { nodes {
                    id
                    project { id number field(name: "Status") { ... on ProjectV2SingleSelectField { id options { id name } } } }
                  } } } }
                }`,
                { owner, repo, n: issue_number },
              );
              const item = repository.issue.projectItems.nodes.find((i) => i.project.number === Number(process.env.PROJECT_NUMBER));
              const option = item?.project.field.options.find((o) => o.name === status);
              if (!option) return core.warning(`#${issue_number}: no board item or Status "${status}"`);
              await projects.graphql(
                `mutation($p: ID!, $i: ID!, $f: ID!, $o: String!) {
                  updateProjectV2ItemFieldValue(input: { projectId: $p, itemId: $i, fieldId: $f, value: { singleSelectOptionId: $o } }) { projectV2Item { id } }
                }`,
                { p: item.project.id, i: item.id, f: item.project.field.id, o: option.id },
              );
            }

            const list = (blockers) => blockers.map((b) => `- #${b.number} ${b.title}`).join('\n');

            if (context.eventName === 'issues' && context.payload.action === 'assigned') {
              const issue = context.payload.issue;
              const blockers = await openBlockers(issue.number);
              await syncBlockedLabel(issue, blockers);
              if (blockers.length === 0) return setStatus(issue.number, 'In progress');
              await github.rest.issues.removeAssignees({
                owner, repo, issue_number: issue.number, assignees: [context.payload.assignee.login],
              });
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `@${context.payload.assignee.login} אי אפשר לקחת את המשימה עדיין. היא חסומה על ידי:\n\n${list(blockers)}\n\nבחרו משימה מהעמודה **Ready** בבורד.`,
              });
              return;
            }

            if (context.eventName === 'issues') {
              // An issue was closed or reopened: refresh every issue it blocks.
              const dependents = await github.paginate('GET /repos/{owner}/{repo}/issues/{issue_number}/dependencies/blocking', {
                owner, repo, issue_number: context.payload.issue.number,
              });
              for (const dependent of dependents.filter((d) => d.state === 'open')) {
                const blockers = await openBlockers(dependent.number);
                const unblocked = await syncBlockedLabel(dependent, blockers);
                if (unblocked) {
                  await setStatus(dependent.number, 'Ready');
                  await github.rest.issues.createComment({
                    owner, repo, issue_number: dependent.number,
                    body: `כל החסמים נסגרו (האחרון: #${context.payload.issue.number}). המשימה מוכנה לעבודה.`,
                  });
                } else if (blockers.length > 0 && context.payload.action === 'reopened') {
                  await setStatus(dependent.number, 'Backlog');
                }
              }
              return;
            }

            // Pull Request: it must name its issue, and every issue it closes must have no open blockers.
            const pr = context.payload.pull_request;
            const body = pr.body ?? '';
            const closing = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi;
            const numbers = [...new Set([...body.matchAll(closing)].map((m) => Number(m[1])))];
            const refs = [...body.matchAll(/\bref(?:s|erences)?\s+#(\d+)/gi)];
            const isRelease = pr.base.ref === 'main' && pr.head.ref === 'dev';
            if (!isRelease && numbers.length === 0 && refs.length === 0) {
              return core.setFailed(
                'Link this Pull Request to its issue: write "Closes #<N>" (finishes it) or "Refs #<N>" (part of it) in the description. No issue yet? Create one first.',
              );
            }
            const problems = [];
            for (const n of numbers) {
              const blockers = await openBlockers(n);
              if (blockers.length > 0) problems.push(`#${n} is blocked by ${blockers.map((b) => `#${b.number}`).join(', ')}`);
            }
            if (problems.length > 0) {
              core.setFailed(`This Pull Request closes issues that still have open blockers:\n${problems.join('\n')}`);
            }
