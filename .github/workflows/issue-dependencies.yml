# Enforces the "Blocked by" relationships between issues:
# - an issue with open blockers cannot be assigned (the assignment is undone with a comment);
# - a Pull Request cannot close an issue that still has open blockers (the check fails);
# - every Pull Request (except a release from dev into main) names its issue with "Closes #N" (one issue, one Pull Request);
# - the `blocked` label always matches whether an issue has open blockers. Closing or reopening an issue refreshes
#   the issues it blocks at once. Actions cannot listen to "Blocked by" links being added or removed, so a scheduled
#   run re-checks every open issue.
# With the PROJECT_TOKEN secret (a token with the `project` and `repo` scopes) it also moves board cards between
# Backlog (blocked) and Ready, to In progress on assignment, back to Ready when the last assignee leaves, and to In
# review when a Pull Request that closes the issue opens or leaves draft, and to Done when it is merged. A Pull
# Request merged into dev also closes the issues it names with "Closes #N" and unblocks their dependents (GitHub
# itself does that only for the default branch). The scheduled run also copies each card's Priority and Size into `priority: <P>` and `size: <S>` labels, for agents that cannot reach the board (it needs
# GraphQL, which cloud sessions do not have). Without the secret the board is updated by hand.
name: Issue dependencies

on:
  issues:
    types: [assigned, unassigned, closed, reopened]
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, closed]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: read

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PROJECT_NUMBER: 6
        with:
          script: |
            const { owner, repo } = context.repo;

            async function openBlockers(issue_number) {
              const blockers = await github.paginate('GET /repos/{owner}/{repo}/issues/{issue_number}/dependencies/blocked_by', {
                owner, repo, issue_number,
              });
              return blockers.filter((b) => b.state === 'open');
            }

            /** Adds or removes `blocked`. Returns true when the label was just removed. */
            async function syncBlockedLabel(issue, blockers) {
              const has = issue.labels.some((l) => (l.name ?? l) === 'blocked');
              if (blockers.length > 0 && !has) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: ['blocked'] });
              } else if (blockers.length === 0 && has) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: issue.number, name: 'blocked' });
                return true;
              }
              return false;
            }

            /** GraphQL with PROJECT_TOKEN: the default token cannot reach a user-owned project. */
            async function projectQuery(query, variables) {
              const response = await fetch('https://api.github.com/graphql', {
                method: 'POST',
                headers: { authorization: `bearer ${process.env.PROJECT_TOKEN}`, 'content-type': 'application/json' },
                body: JSON.stringify({ query, variables }),
              });
              const result = await response.json();
              if (!response.ok || result.errors) throw new Error(`Project API: ${JSON.stringify(result.errors ?? result)}`);
              return result.data;
            }

            /** Sets the issue's board Status. `from` limits the change to cards currently in one of those columns. */
            async function setStatus(issue_number, status, from = null) {
              if (!process.env.PROJECT_TOKEN) return;
              const { repository } = await projectQuery(
                `query($owner: String!, $repo: String!, $n: Int!) {
                  repository(owner: $owner, name: $repo) { issue(number: $n) { projectItems(first: 20) { nodes {
                    id
                    fieldValueByName(name: "Status") { ... on ProjectV2ItemFieldSingleSelectValue { name } }
                    project { id number field(name: "Status") { ... on ProjectV2SingleSelectField { id options { id name } } } }
                  } } } }
                }`,
                { owner, repo, n: issue_number },
              );
              const item = repository.issue.projectItems.nodes.find((i) => i.project.number === Number(process.env.PROJECT_NUMBER));
              if (!item) return core.warning(`#${issue_number} is not on the board`);
              const current = item.fieldValueByName?.name ?? null;
              if (current === status || (from && !from.includes(current))) return;
              const option = item.project.field.options.find((o) => o.name === status);
              if (!option) return core.warning(`The board has no Status "${status}"`);
              await projectQuery(
                `mutation($p: ID!, $i: ID!, $f: ID!, $o: String!) {
                  updateProjectV2ItemFieldValue(input: { projectId: $p, itemId: $i, fieldId: $f, value: { singleSelectOptionId: $o } }) { projectV2Item { id } }
                }`,
                { p: item.project.id, i: item.id, f: item.project.field.id, o: option.id },
              );
            }

            /** Copies the card's Priority and Size into `priority: <P>` and `size: <S>` labels, replacing older ones. */
            async function syncFieldLabels(issue) {
              if (!process.env.PROJECT_TOKEN) return;
              const { repository } = await projectQuery(
                `query($owner: String!, $repo: String!, $n: Int!) {
                  repository(owner: $owner, name: $repo) { issue(number: $n) { projectItems(first: 20) { nodes {
                    project { number }
                    priority: fieldValueByName(name: "Priority") { ... on ProjectV2ItemFieldSingleSelectValue { name } }
                    size: fieldValueByName(name: "Size") { ... on ProjectV2ItemFieldSingleSelectValue { name } }
                  } } } }
                }`,
                { owner, repo, n: issue.number },
              );
              const item = repository.issue.projectItems.nodes.find((i) => i.project.number === Number(process.env.PROJECT_NUMBER));
              if (!item) return;
              const current = issue.labels.map((l) => l.name ?? l);
              for (const [prefix, value] of [['priority: ', item.priority?.name], ['size: ', item.size?.name]]) {
                const wanted = value ? `${prefix}${value}` : null;
                for (const name of current.filter((n) => n.startsWith(prefix) && n !== wanted)) {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number: issue.number, name });
                }
                if (wanted && !current.includes(wanted)) {
                  await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: [wanted] });
                }
              }
            }

            /** Brings one open issue's labels and board column in line with its blockers and its card. Returns true when it was just unblocked. */
            async function refresh(issue) {
              const blockers = await openBlockers(issue.number);
              const unblocked = await syncBlockedLabel(issue, blockers);
              if (blockers.length > 0) await setStatus(issue.number, 'Backlog', ['Ready']);
              else await setStatus(issue.number, 'Ready', ['Backlog']);
              await syncFieldLabels(issue);
              return unblocked;
            }

            const list = (blockers) => blockers.map((b) => `- #${b.number} ${b.title}`).join('\n');

            if (context.eventName === 'schedule' || context.eventName === 'workflow_dispatch') {
              const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', per_page: 100 });
              for (const issue of issues.filter((i) => !i.pull_request)) await refresh(issue);
              return;
            }

            if (context.eventName === 'issues' && context.payload.action === 'assigned') {
              const issue = context.payload.issue;
              const blockers = await openBlockers(issue.number);
              await syncBlockedLabel(issue, blockers);
              if (blockers.length === 0) return setStatus(issue.number, 'In progress', ['Backlog', 'Ready']);
              await github.rest.issues.removeAssignees({
                owner, repo, issue_number: issue.number, assignees: [context.payload.assignee.login],
              });
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `@${context.payload.assignee.login} אי אפשר לקחת את המשימה עדיין. היא חסומה על ידי:\n\n${list(blockers)}\n\nבחרו משימה מהעמודה **Ready** בבורד.`,
              });
              return;
            }

            if (context.eventName === 'issues' && context.payload.action === 'unassigned') {
              // Work stopped without finishing: once nobody holds the issue, it goes back to Ready (or Backlog).
              const issue = context.payload.issue;
              if (issue.state !== 'open' || issue.assignees.length > 0) return;
              const blockers = await openBlockers(issue.number);
              return setStatus(issue.number, blockers.length > 0 ? 'Backlog' : 'Ready', ['In progress']);
            }

            /** Refreshes every open issue that the given issue blocks (after it closed or reopened). */
            async function refreshDependents(issue_number) {
              const dependents = await github.paginate('GET /repos/{owner}/{repo}/issues/{issue_number}/dependencies/blocking', {
                owner, repo, issue_number,
              });
              for (const dependent of dependents.filter((d) => d.state === 'open')) {
                if (await refresh(dependent)) {
                  await github.rest.issues.createComment({
                    owner, repo, issue_number: dependent.number,
                    body: `כל החסמים נסגרו (האחרון: #${issue_number}). המשימה מוכנה לעבודה.`,
                  });
                }
              }
            }

            if (context.eventName === 'issues') return refreshDependents(context.payload.issue.number);

            // Pull Request: it must name its issue, and every issue it closes must have no open blockers.
            const pr = context.payload.pull_request;
            const body = (pr.body ?? '').replace(/<!--[\s\S]*?-->/g, '');
            // Only at the start of a line, so prose such as "does not fix #40" never closes an issue.
            const closing = /^[ \t]*(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)[ \t]+#(\d+)/gim;
            const numbers = [...new Set([...body.matchAll(closing)].map((m) => Number(m[1])))];

            if (context.payload.action === 'closed') {
              // Merged into dev: GitHub closes "Closes #N" issues only on the default branch, so close them here.
              if (!pr.merged || pr.base.ref !== 'dev') return;
              // Issues closed with the default token start no workflow run, so unblock the dependents here too.
              for (const n of numbers) {
                try {
                  const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: n });
                  if (issue.pull_request || issue.state !== 'open') continue;
                  await github.rest.issues.update({ owner, repo, issue_number: n, state: 'closed', state_reason: 'completed' });
                  await github.rest.issues.createComment({ owner, repo, issue_number: n, body: `Closed by #${pr.number}, merged into dev.` });
                  await setStatus(n, 'Done');
                  await refreshDependents(n);
                } catch (error) {
                  core.setFailed(`Could not close #${n}: ${error.message}`);
                }
              }
              return;
            }

            const isRelease = pr.base.ref === 'main' && pr.head.ref === 'dev';
            if (!isRelease && numbers.length === 0) {
              return core.setFailed(
                'Link this Pull Request to its issue: write "Closes #<N>" in the description (one issue, one Pull Request; "Refs" is not accepted). No issue yet? Create one first.',
              );
            }
            const problems = [];
            for (const n of numbers) {
              const blockers = await openBlockers(n);
              if (blockers.length > 0) problems.push(`#${n} is blocked by ${blockers.map((b) => `#${b.number}`).join(', ')}`);
            }
            if (problems.length > 0) {
              core.setFailed(`This Pull Request closes issues that still have open blockers:\n${problems.join('\n')}`);
            } else if (['opened', 'reopened', 'ready_for_review'].includes(context.payload.action) && !pr.draft) {
              for (const n of numbers) await setStatus(n, 'In review', ['Ready', 'In progress']);
            }
