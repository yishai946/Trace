name: Project board automation

# Keeps the "Trace Board" GitHub Project in sync with issues and PRs.
# Requires: repo variables PROJECT_OWNER + PROJECT_NUMBER, and secret PROJECT_TOKEN
# (a PAT with `project` + `repo` scopes). scripts/setup-project.sh configures all three.

on:
  issues:
    types: [opened, reopened, closed, assigned, unassigned, labeled, unlabeled]
  pull_request_target:
    types: [opened, reopened, ready_for_review, converted_to_draft, closed]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: board-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  sync:
    if: vars.PROJECT_NUMBER != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          PROJECT_OWNER: ${{ vars.PROJECT_OWNER }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const owner = process.env.PROJECT_OWNER;
            const number = Number(process.env.PROJECT_NUMBER);

            const FIELDS = `id fields(first: 30) { nodes {
              ... on ProjectV2Field { id name }
              ... on ProjectV2SingleSelectField { id name options { id name } } } }`;

            async function loadProject() {
              for (const kind of ['user', 'organization']) {
                try {
                  const r = await github.graphql(
                    `query($login:String!,$n:Int!){ ${kind}(login:$login){ projectV2(number:$n){ ${FIELDS} } } }`,
                    { login: owner, n: number });
                  if (r[kind] && r[kind].projectV2) return r[kind].projectV2;
                } catch (e) { /* try next owner type */ }
              }
              throw new Error(`Project ${owner}/${number} not found or token lacks access`);
            }
            const project = await loadProject();
            const field = (n) => project.fields.nodes.find((f) => f && f.name === n);

            async function addItem(nodeId) {
              const r = await github.graphql(
                `mutation($p:ID!,$c:ID!){ addProjectV2ItemById(input:{projectId:$p,contentId:$c}){ item{ id } } }`,
                { p: project.id, c: nodeId });
              return r.addProjectV2ItemById.item.id;
            }
            async function getStatus(itemId) {
              const r = await github.graphql(
                `query($i:ID!){ node(id:$i){ ... on ProjectV2Item { fieldValueByName(name:"Status"){ ... on ProjectV2ItemFieldSingleSelectValue { name } } } } }`,
                { i: itemId });
              return r.node?.fieldValueByName?.name ?? null;
            }
            async function setSelect(itemId, fieldName, optionName) {
              const f = field(fieldName);
              const o = f?.options?.find((x) => x.name === optionName);
              if (!o) { core.warning(`No option "${optionName}" in field "${fieldName}"`); return; }
              await github.graphql(
                `mutation($p:ID!,$i:ID!,$f:ID!,$o:String!){ updateProjectV2ItemFieldValue(input:{projectId:$p,itemId:$i,fieldId:$f,value:{singleSelectOptionId:$o}}){ projectV2Item{ id } } }`,
                { p: project.id, i: itemId, f: f.id, o: o.id });
            }
            const setStatus = (itemId, name) => setSelect(itemId, 'Status', name);

            const labelNames = (issue) => (issue.labels || []).map((l) => (typeof l === 'string' ? l : l.name));

            async function syncPhase(itemId, issue) {
              const l = labelNames(issue).find((n) => n.startsWith('phase: '));
              if (l) await setSelect(itemId, 'Phase', l.slice('phase: '.length));
            }

            // ---------- issue events ----------
            async function onIssue() {
              const issue = context.payload.issue;
              const action = context.payload.action;
              const labels = labelNames(issue);
              const item = await addItem(issue.node_id);
              const status = await getStatus(item);
              await syncPhase(item, issue);

              switch (action) {
                case 'opened':
                  if (!status) await setStatus(item, labels.includes('blocked') ? 'Blocked' : 'Backlog');
                  break;
                case 'labeled':
                case 'unlabeled': {
                  const name = context.payload.label?.name;
                  if (name === 'blocked') {
                    if (action === 'labeled') await setStatus(item, 'Blocked');
                    else if (status === 'Blocked') await setStatus(item, 'Ready');
                  }
                  // QA sign-off = removing needs-qa from a closed issue
                  if (name === 'needs-qa' && action === 'unlabeled' && issue.state === 'closed') await setStatus(item, 'Done');
                  break;
                }
                case 'assigned':
                  if (!status || ['Backlog', 'Ready'].includes(status)) await setStatus(item, 'In Progress');
                  break;
                case 'unassigned':
                  if (issue.assignees.length === 0 && status === 'In Progress') await setStatus(item, 'Ready');
                  break;
                case 'closed':
                  await setStatus(item, labels.includes('needs-qa') ? 'QA' : 'Done');
                  break;
                case 'reopened':
                  await setStatus(item, issue.assignees.length ? 'In Progress' : 'Ready');
                  break;
              }
            }

            // ---------- PR events ----------
            function linkedIssueNumbers(body) {
              const nums = new Set();
              const re = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi;
              let m; while ((m = re.exec(body || ''))) nums.add(Number(m[1]));
              return [...nums];
            }
            async function onPullRequest() {
              const pr = context.payload.pull_request;
              const action = context.payload.action;
              const review = context.payload.review;
              let target = null;
              if (context.eventName === 'pull_request_review') {
                if (review.state === 'changes_requested') target = 'In Progress';
                else return;
              } else if (action === 'closed') {
                if (!pr.merged) target = 'In Progress';
              } else if (action === 'converted_to_draft' || pr.draft) {
                target = 'In Progress';
              } else {
                target = 'In Review';
              }
              for (const n of linkedIssueNumbers(pr.body)) {
                const { data: issue } = await github.rest.issues.get({ ...context.repo, issue_number: n });
                const item = await addItem(issue.node_id);
                await syncPhase(item, issue);
                if (action === 'closed' && pr.merged) {
                  await setStatus(item, labelNames(issue).includes('needs-qa') ? 'QA' : 'Done');
                } else if (target) {
                  await setStatus(item, target);
                }
              }
            }

            if (context.eventName === 'issues') await onIssue();
            else await onPullRequest();
