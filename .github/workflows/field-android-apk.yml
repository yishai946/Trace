name: Field Android APK

# Builds a signed APK for manual install (no EAS account). Signed with a fixed keystore kept in GitHub secrets, so the
# signing fingerprint stays the same between builds (needed for assetlinks.json, #141). See docs/TECH_STACK.md.
on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Debug includes the dev client (Fast Refresh with expo start --dev-client); Release embeds the JS
        type: choice
        options: [Release, Debug]
        default: Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Check the signing secrets
        run: |
          missing=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Create the keystore and set them as described in docs/TECH_STACK.md (Field APK)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: pnpm install --frozen-lockfile

      - name: Generate the native Android project
        working-directory: apps/field
        run: npx expo prebuild --platform android --no-install

      - name: Build
        working-directory: apps/field/android
        run: ./gradlew assemble${{ inputs.configuration }}

      - name: Sign with the fixed keystore
        working-directory: apps/field/android
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/trace-field.jks"
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          CONFIG=$(echo "${{ inputs.configuration }}" | tr '[:upper:]' '[:lower:]')
          SRC=$(ls app/build/outputs/apk/"$CONFIG"/*.apk | head -n 1)
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/trace-field.jks" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --out TraceField.apk "$SRC"
          "$APKSIGNER" verify TraceField.apk
          rm -f "$RUNNER_TEMP/trace-field.jks"

      - name: Show the signing fingerprint
        working-directory: apps/field/android
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          SHA=$("$APKSIGNER" verify --print-certs TraceField.apk | grep 'SHA-256 digest' | head -n 1 | awk '{print $NF}')
          echo "Signing certificate SHA-256: $SHA"
          echo "Signing certificate SHA-256: \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: TraceField-${{ inputs.configuration }}-apk
          path: apps/field/android/TraceField.apk
          retention-days: 7
