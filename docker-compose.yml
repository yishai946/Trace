# Local development services. Production hosting is decided by the platform engineer.
services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: trace
      POSTGRES_PASSWORD: trace
      POSTGRES_DB: trace
    ports:
      - '${TRACE_DB_PORT:-5433}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trace -d trace']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db-data:
